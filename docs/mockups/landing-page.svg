    <circle cx="590" cy="148" r="4" fill="#e5a078"/><circle cx="604" cy="148" r="4" fill="#e4c47d"/><circle cx="618" cy="148" r="4" fill="#9dc2a6"/>
    <text x="682" y="152" fill="#97a39b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR MEETING, MADE USEFUL</text>
    <text x="594" y="210" fill="#8d9991" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">TUESDAY · PRODUCT</text>
    <text x="594" y="240" fill="#23332f" font-family="Arial,sans-serif" font-size="23" font-weight="700">Weekly product sync</text>
