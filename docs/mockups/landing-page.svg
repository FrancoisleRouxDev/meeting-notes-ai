<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Meeting Notes AI welcome page mockup</title>
  <desc id="description">A welcoming product landing page with a meeting summary preview and a get started call to action.</desc>
  <rect width="1200" height="720" fill="#f7f8f4"/>
  <path d="M880 100c100-70 240 0 300 75v360c-80 20-180-5-250-50-90-60-150-250-50-385Z" fill="#e7eee5"/>
  <rect x="68" y="28" width="34" height="34" rx="9" fill="#286f5c"/>
  <text x="79" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">m</text>
  <text x="112" y="52" fill="#23332f" font-family="Arial,sans-serif" font-size="22" font-weight="700">meeting</text>
  <text x="204" y="52" fill="#718078" font-family="Arial,sans-serif" font-size="22">notes</text>
  <text x="262" y="42" fill="#286f5c" font-family="Arial,sans-serif" font-size="10" font-weight="700">AI</text>
  <text x="690" y="50" fill="#586860" font-family="Arial,sans-serif" font-size="14">How it works</text>
  <text x="825" y="50" fill="#586860" font-family="Arial,sans-serif" font-size="14">Why Meeting Notes</text>
  <text x="1015" y="50" fill="#586860" font-family="Arial,sans-serif" font-size="14">Sign in</text>
  <rect x="1080" y="29" width="96" height="38" rx="9" fill="#286f5c"/>
  <text x="1098" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Get started</text>
  <circle cx="78" cy="168" r="5" fill="#d78a56"/>
  <text x="92" y="172" fill="#286f5c" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">A LITTLE MORE CLARITY AFTER EVERY MEETING</text>
  <text x="68" y="247" fill="#23332f" font-family="Arial,sans-serif" font-size="51" font-weight="700" letter-spacing="-2">Good meetings deserve</text>
  <text x="68" y="306" fill="#286f5c" font-family="Arial,sans-serif" font-size="51" font-weight="700" letter-spacing="-2">great follow-through.</text>
  <text x="68" y="353" fill="#63726a" font-family="Arial,sans-serif" font-size="17">Turn a meeting transcript into a clear summary, decisions,</text>
  <text x="68" y="380" fill="#63726a" font-family="Arial,sans-serif" font-size="17">and action items—with owners, dates, and a link back to</text>
  <text x="68" y="407" fill="#63726a" font-family="Arial,sans-serif" font-size="17">the words that matter.</text>
  <rect x="68" y="443" width="145" height="50" rx="9" fill="#286f5c"/>
  <text x="88" y="474" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Try it free   →</text>
  <rect x="225" y="443" width="172" height="50" rx="9" fill="#f7f8f4" stroke="#d7e1d8"/>
  <text x="250" y="474" fill="#23332f" font-family="Arial,sans-serif" font-size="14" font-weight="700">See how it works</text>
  <text x="68" y="527" fill="#78857e" font-family="Arial,sans-serif" font-size="12">Your transcript stays yours. AI suggestions are yours to review and edit.</text>
  <g transform="rotate(1 820 360)">
