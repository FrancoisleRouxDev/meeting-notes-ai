    <text x="1041" y="213" fill="#36735d" font-family="Arial,sans-serif" font-size="11" font-weight="700">AI notes</text>
    <rect x="592" y="260" width="520" height="91" rx="11" fill="#f7f9f5"/>
    <rect x="608" y="277" width="30" height="30" rx="8" fill="#e0eee4"/>
    <text x="617" y="298" fill="#39745e" font-family="Arial,sans-serif" font-size="15" font-weight="700">✦</text>
    <text x="650" y="287" fill="#23332f" font-family="Arial,sans-serif" font-size="13" font-weight="700">The short version</text>
    <text x="650" y="309" fill="#66746b" font-family="Arial,sans-serif" font-size="12">The team aligned on the launch sequence and agreed</text>
    <text x="650" y="328" fill="#66746b" font-family="Arial,sans-serif" font-size="12">to resolve the last onboarding issues before release.</text>
    <rect x="592" y="361" width="520" height="68" rx="11" fill="#fbf8f1"/>
    <rect x="608" y="379" width="30" height="30" rx="8" fill="#f4e8d8"/>
    <text x="617" y="399" fill="#a06e3d" font-family="Arial,sans-serif" font-size="15" font-weight="700">✓</text>
    <text x="650" y="387" fill="#23332f" font-family="Arial,sans-serif" font-size="13" font-weight="700">Decision</text>
    <text x="650" y="409" fill="#66746b" font-family="Arial,sans-serif" font-size="12">Keep the beta open through Friday, then review feedback.</text>
    <text x="594" y="463" fill="#23332f" font-family="Arial,sans-serif" font-size="14" font-weight="700">Next up</text>
    <text x="1040" y="463" fill="#89958d" font-family="Arial,sans-serif" font-size="11">2 action items</text>
    <rect x="597" y="483" width="14" height="14" rx="4" fill="none" stroke="#b5c5b8" stroke-width="1.5"/>
    <text x="622" y="493" fill="#23332f" font-family="Arial,sans-serif" font-size="12" font-weight="700">Send the revised proposal</text>
    <text x="622" y="511" fill="#87938c" font-family="Arial,sans-serif" font-size="10">Maya  ·  Fri, Nov 28</text>
    <text x="1032" y="501" fill="#39745e" font-family="Arial,sans-serif" font-size="10" font-weight="700">Line 12</text>
    <rect x="597" y="523" width="14" height="14" rx="4" fill="none" stroke="#b5c5b8" stroke-width="1.5"/>
    <text x="622" y="533" fill="#23332f" font-family="Arial,sans-serif" font-size="12" font-weight="700">Confirm the launch checklist</text>
    <text x="622" y="550" fill="#87938c" font-family="Arial,sans-serif" font-size="10">Ethan  ·  Not stated</text>
    <text x="1032" y="541" fill="#39745e" font-family="Arial,sans-serif" font-size="10" font-weight="700">Line 18</text>
  </g>
  <text x="68" y="670" fill="#849087" font-family="Arial,sans-serif" font-size="12">Thoughtful notes for what comes next.</text>
